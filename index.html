<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://www.google.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.google.com/recaptcha/; frame-src 'self' https://*.firebaseapp.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />

  <!-- Icona per il favicon e il PWA -->
  <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Colore per la status bar su Safari iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Barra di stato trasparente in Chrome -->
  <meta name="theme-color" content="#f9f9fb" />

  <!-- Descrizione del sito -->
  <meta name="description" content="Gestisci le tue finanze in modo semplice e veloce." />

  <!-- Manifest per PWA -->
  <link rel="manifest" href="manifest.json" />

  <title>Soldi Sotto</title>

  <!-- Applica il tema prima del caricamento di React senza script inline. -->
  <script type="module" src="/src/theme-init.js"></script>

  <style>
    /* Pre-React background matching Tailwind's --background values to prevent flash */
    :root {
      background-color: #f9f9fb; /* hsl(220 27% 98%) - light theme */
    }

    .dark {
      background-color: #080c16; /* hsl(222 47% 6%) - dark theme */
    }

    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: inherit;
    }
  </style>

  <!-- Design System -->
  <link rel="stylesheet" href="src/styles/design-system.css" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Script principale -->
  <script type="module" src="src/main.jsx"></script>
</body>

</html>
