<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.github.com; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />

  <!-- Icona per il favicon e il PWA -->
  <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Colore per la status bar su Safari iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ducat" />

  <!-- Barra di stato trasparente in Chrome -->
  <meta name="theme-color" content="#f5f6f8" />

  <!-- Descrizione del sito -->
  <meta name="description" content="Gestisci le tue finanze in modo semplice e veloce." />

  <!-- Manifest per PWA -->
  <link rel="manifest" href="manifest.json" />

  <title>Ducat</title>

  <!-- Applica il tema prima del caricamento di React senza script inline. -->
  <script type="module" src="/src/theme-init.js"></script>

  <style>
    /* Pre-React background matching Tailwind's --background values to prevent flash */
    :root {
      background-color: #f5f6f8; /* hsl(220 20% 97%) - light theme */
    }

    .dark {
      background-color: #0b0d13; /* hsl(225 25% 6%) - dark theme */
    }

    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: inherit;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Script principale -->
  <script type="module" src="src/main.jsx"></script>
</body>

</html>
