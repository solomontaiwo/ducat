<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <!-- Icona per il favicon e il PWA -->
  <link rel="icon" href="icon.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icon.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <!-- Colore per la status bar su Safari iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Barra di stato trasparente in Chrome -->
  <meta name="theme-color" content="#f0f0f0" />

  <!-- Descrizione del sito -->
  <meta name="description" content="Gestisci le tue finanze in modo semplice e veloce." />

  <!-- Manifest per PWA -->
  <link rel="manifest" href="manifest.json" />

  <title>Soldi Sotto</title>

  <!-- Fix for potential React Refresh error in production -->
  <script>
    window.$RefreshReg$ = function () {};
    window.$RefreshSig$ = function () { return function (type) { return type; }; };
  </script>

  <!-- Script per applicare il tema salvato prima del caricamento di React -->
  <script>
    (function () {
      function setThemeMeta() {
        const savedTheme = localStorage.getItem("theme") || "system";
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDarkMode = savedTheme === "dark" || (savedTheme === "system" && systemPrefersDark);
        document.documentElement.classList.toggle("dark", isDarkMode);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", isDarkMode ? "#0f172a" : "#f8fafc");
        const statusBarMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusBarMeta) {
          statusBarMeta.setAttribute("content", isDarkMode ? "black" : "default");
        }
      }
      setThemeMeta();
      window.addEventListener('storage', setThemeMeta);
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener('change', setThemeMeta);
    })();
  </script>

  <style>
    /* Pre-React background matching Tailwind's --background values to prevent flash */
    :root {
      background-color: #f8fafc; /* hsl(210 40% 98%) - light theme */
    }

    .dark {
      background-color: #0d1117; /* hsl(210 29% 7%) - dark theme */
    }

    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: inherit;
    }
  </style>

  <!-- Design System -->
  <link rel="stylesheet" href="src/styles/design-system.css" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Google Fonts - Inter for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Script principale -->
  <script type="module" src="src/main.jsx"></script>
</body>

</html>
