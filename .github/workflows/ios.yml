name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS app
    runs-on: xcode-27
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_DESKTOP_WEB_URL: ${{ vars.VITE_DESKTOP_WEB_URL }}
      VITE_ENABLE_ACCOUNT_DELETION: ${{ vars.VITE_ENABLE_ACCOUNT_DELETION || 'true' }}
      VITE_APP_VERSION: ${{ github.sha }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        # Xcode 27 (iOS 27 SDK) is required: apps built with an older SDK run in
        # compatibility mode on the iPhone Duo (letterboxed on both screens),
        # and App Store Connect requires it from April 2027.
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 27 ]; then
            echo "The iOS build requires Xcode 27 or later, found $(xcodebuild -version | head -n 1)" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify public configuration
        shell: bash
        run: |
          node -e 'if (!process.env.VITE_SUPABASE_URL || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY) { console.error("Missing Supabase build configuration"); process.exit(1) }'
          node -e 'const value = process.env.VITE_DESKTOP_WEB_URL; if (value) { const url = new URL(value); if (url.protocol !== "https:") throw new Error("Desktop web URL must be HTTPS"); }'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync Capacitor
        run: |
          npm run mobile:build
          npx cap sync ios
          node scripts/sync-ios-version.mjs

      - name: Check generated configuration
        run: |
          test -f ios/App/App/public/index.html
          test -f ios/App/App/PrivacyInfo.xcprivacy
          test -f ios/App/App/BiometricAuthPlugin.swift
          test -f ios/App/App/NativeFeaturesPlugin.swift
          test -f ios/App/App/MainViewController.swift
          test -f ios/App/App/VerticalBarNavigation.swift
          grep -q "PrivacyInfo.xcprivacy in Resources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "BiometricAuthPlugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "NativeFeaturesPlugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "VerticalBarNavigation.swift in Sources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist
          grep -q "NSFaceIDUsageDescription" ios/App/App/Info.plist

      - name: Build for the simulator (no signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Import signing certificate
        if: ${{ inputs.upload }}
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "APPLE_CERTIFICATE_P12 is not configured" >&2
            exit 1
          fi
          echo -n "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Install provisioning profile
        if: ${{ inputs.upload }}
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Sign the release with the App Store profile
        if: ${{ inputs.upload }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Automatic signing would create a new development certificate on
        # every run and fail once Apple's limit is reached.
        run: node scripts/ios-release-signing.mjs "$PROFILE_UUID" "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Write App Store Connect API key
        if: ${{ inputs.upload }}
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo -n "$API_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"

      - name: Archive and export
        if: ${{ inputs.upload }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Upload artifacts
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
