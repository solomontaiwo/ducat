name: Delete Merged Branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches already merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch all remote branches
          git fetch --all --prune

          # Find branches merged into main, strip the "origin/" prefix
          git branch -r --merged origin/main \
            | grep -v 'origin/HEAD' \
            | sed 's|^\s*origin/||' \
            | while IFS= read -r branch; do
                case "$branch" in
                  main|gh-pages) echo "Skipping protected branch: $branch" ;;
                  *)
                    echo "Deleting merged branch: $branch"
                    gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" \
                      && echo "  Deleted: $branch" \
                      || echo "  Failed to delete: $branch (may already be gone)"
                    ;;
                esac
              done
