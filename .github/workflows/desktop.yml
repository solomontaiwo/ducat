name: Desktop builds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-arm64
            files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            updater-files: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x64
            files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            updater-files: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            updater-files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            artifact: windows-arm64
            files: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            updater-files: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ENABLE_ACCOUNT_DELETION: ${{ vars.VITE_ENABLE_ACCOUNT_DELETION || 'true' }}
      VITE_DESKTOP_WEB_URL: ${{ vars.VITE_DESKTOP_WEB_URL }}
      VITE_APP_VERSION: ${{ github.sha }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify public Supabase configuration
        shell: bash
        run: |
          node -e 'if (!process.env.VITE_SUPABASE_URL || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY) { console.error("Missing Supabase build configuration"); process.exit(1) }'
          node -e 'const value = process.env.VITE_DESKTOP_WEB_URL; if (value) { const url = new URL(value); if (url.protocol !== "https:" || !url.pathname.endsWith("/")) throw new Error("Desktop web URL must be HTTPS and end with a slash"); }'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      # Without a Developer ID, Tauri skips signing and the bundle keeps only the
      # linker's ad-hoc signature: macOS then reports the app as "damaged"
      # because Contents/_CodeSignature is missing. Signing ad-hoc here keeps
      # the bundle valid and downgrades the warning to the usual Gatekeeper prompt.
      - name: Use ad-hoc signing when no Developer ID is configured
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY == ''
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build desktop packages
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"plugins":{"updater":{"endpoints":["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]}}}'

      - name: Verify Windows executable architecture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          $path = "src-tauri/target/$env:TARGET_TRIPLE/release/ducat.exe"
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($path))
          try {
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw "Invalid DOS header" }
            $reader.BaseStream.Position = 0x3c
            $offset = $reader.ReadUInt32()
            $reader.BaseStream.Position = $offset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE header" }
            $machine = $reader.ReadUInt16()
            $expected = if ($env:TARGET_TRIPLE -eq 'aarch64-pc-windows-msvc') { 0xaa64 } else { 0x8664 }
            if ($machine -ne $expected) { throw "Unexpected PE machine: $machine; expected $expected" }
            Write-Host "Verified PE architecture: $env:TARGET_TRIPLE"
          } finally {
            $reader.Dispose()
          }

      - name: Check Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          $bundle = "src-tauri/target/$env:TARGET_TRIPLE/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $bundle -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)" }
          $installDir = Join-Path $env:RUNNER_TEMP 'ducat-install-check'
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Windows installer failed with exit code $($installer.ExitCode)" }
          $built = "src-tauri/target/$env:TARGET_TRIPLE/release/ducat.exe"
          $installed = Join-Path $installDir 'ducat.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw "Installed executable not found: $installed" }
          # Tauri patches the first bundle-type marker for NSIS, then restores the original build.
          $expectedBytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $built).Path)
          $originalMarker = '__TAURI_BUNDLE_TYPE_VAR_UNK'
          $nsisMarker = [System.Text.Encoding]::ASCII.GetBytes('__TAURI_BUNDLE_TYPE_VAR_NSS')
          $markerOffset = [System.Text.Encoding]::Latin1.GetString($expectedBytes).IndexOf($originalMarker, [System.StringComparison]::Ordinal)
          if ($markerOffset -lt 0) { throw 'Tauri bundle-type marker not found in compiled executable' }
          [System.Array]::Copy($nsisMarker, 0, $expectedBytes, $markerOffset, $nsisMarker.Length)
          $expectedHash = [System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($expectedBytes))
          if ($expectedHash -ne (Get-FileHash -LiteralPath $installed).Hash) {
            throw 'Installed executable differs from the compiled executable'
          }
          Write-Host "Verified Windows installation: $env:TARGET_TRIPLE"

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ducat-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            ${{ matrix.files }}
            ${{ matrix.updater-files }}
          if-no-files-found: error
          retention-days: 30

  ubuntu-package:
    name: Ubuntu x64 package
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ENABLE_ACCOUNT_DELETION: ${{ vars.VITE_ENABLE_ACCOUNT_DELETION || 'true' }}
      VITE_DESKTOP_WEB_URL: ${{ vars.VITE_DESKTOP_WEB_URL }}
      VITE_APP_VERSION: ${{ github.sha }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y libwebkit2gtk-4.1-dev build-essential ca-certificates curl wget file git tar gzip libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify public Supabase configuration
        run: |
          node -e 'if (!process.env.VITE_SUPABASE_URL || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY) { console.error("Missing Supabase build configuration"); process.exit(1) }'
          node -e 'const value = process.env.VITE_DESKTOP_WEB_URL; if (value) { const url = new URL(value); if (url.protocol !== "https:" || !url.pathname.endsWith("/")) throw new Error("Desktop web URL must be HTTPS and end with a slash"); }'

      - name: Install dependencies
        run: npm ci

      - name: Build Ubuntu package
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check Ubuntu installation
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y ./src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          ldd /usr/bin/ducat > /tmp/ducat-ldd.txt
          if grep -q 'not found' /tmp/ducat-ldd.txt; then cat /tmp/ducat-ldd.txt; exit 1; fi
          dpkg-query -W ducat

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ducat-linux-x64-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  fedora-package:
    name: Fedora x64 package
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ENABLE_ACCOUNT_DELETION: ${{ vars.VITE_ENABLE_ACCOUNT_DELETION || 'true' }}
      VITE_DESKTOP_WEB_URL: ${{ vars.VITE_DESKTOP_WEB_URL }}
      VITE_APP_VERSION: ${{ github.sha }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc gcc-c++ make pkgconf-pkg-config webkit2gtk4.1-devel openssl-devel curl wget file libayatana-appindicator-gtk3-devel librsvg2-devel libxdo-devel rust cargo git tar gzip

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify public Supabase configuration
        run: |
          node -e 'if (!process.env.VITE_SUPABASE_URL || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY) { console.error("Missing Supabase build configuration"); process.exit(1) }'
          node -e 'const value = process.env.VITE_DESKTOP_WEB_URL; if (value) { const url = new URL(value); if (url.protocol !== "https:" || !url.pathname.endsWith("/")) throw new Error("Desktop web URL must be HTTPS and end with a slash"); }'

      - name: Install dependencies
        run: npm ci

      - name: Build Fedora package
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check Fedora installation
        run: |
          set -eu
          dnf install -y ./src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          ldd /usr/bin/ducat > /tmp/ducat-ldd.txt
          if grep -q 'not found' /tmp/ducat-ldd.txt; then cat /tmp/ducat-ldd.txt; exit 1; fi
          rpm -q ducat

      - name: Upload Fedora package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ducat-fedora-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

  arch-package:
    name: Arch Linux x64 package
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    container: archlinux:base
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ENABLE_ACCOUNT_DELETION: ${{ vars.VITE_ENABLE_ACCOUNT_DELETION || 'true' }}
      VITE_DESKTOP_WEB_URL: ${{ vars.VITE_DESKTOP_WEB_URL }}
      VITE_APP_VERSION: ${{ github.sha }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel webkit2gtk-4.1 openssl curl wget file libappindicator librsvg xdotool rust git jq

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify public Supabase configuration
        run: |
          node -e 'if (!process.env.VITE_SUPABASE_URL || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY) { console.error("Missing Supabase build configuration"); process.exit(1) }'
          node -e 'const value = process.env.VITE_DESKTOP_WEB_URL; if (value) { const url = new URL(value); if (url.protocol !== "https:" || !url.pathname.endsWith("/")) throw new Error("Desktop web URL must be HTTPS and end with a slash"); }'

      - name: Install dependencies
        run: npm ci

      - name: Build native Arch executable
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --no-bundle

      - name: Create Arch package
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ducat-arch"
          install -d "$stage/root/usr/bin" "$stage/root/usr/share/applications" "$stage/root/usr/share/icons/hicolor/512x512/apps"
          install -m755 src-tauri/target/x86_64-unknown-linux-gnu/release/ducat "$stage/root/usr/bin/ducat"
          install -m644 packaging/arch/ducat.desktop "$stage/root/usr/share/applications/ducat.desktop"
          install -m644 public/icon-512.png "$stage/root/usr/share/icons/hicolor/512x512/apps/ducat.png"
          tar -C "$stage/root" -cf "$stage/root.tar" usr
          cp packaging/arch/PKGBUILD "$stage/PKGBUILD"
          version=$(jq -er '.version | gsub("[-+]"; ".")' package.json)
          useradd -m packager
          chown -R packager:packager "$stage"
          cd "$stage"
          runuser -u packager -- env DUCAT_VERSION="$version" makepkg --noconfirm --nodeps
          mkdir -p "$GITHUB_WORKSPACE/arch-artifact"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/arch-artifact/"

      - name: Check Arch installation
        shell: bash
        run: |
          set -euo pipefail
          pacman -U --noconfirm arch-artifact/*.pkg.tar.zst
          ldd /usr/bin/ducat > /tmp/ducat-ldd.txt
          if grep -q 'not found' /tmp/ducat-ldd.txt; then cat /tmp/ducat-ldd.txt; exit 1; fi
          pacman -Q ducat-bin

      - name: Upload Arch package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ducat-arch-x64-${{ github.sha }}
          path: arch-artifact/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

  linux-appimage:
    name: Linux x64 AppImage
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-22.04
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ENABLE_ACCOUNT_DELETION: ${{ vars.VITE_ENABLE_ACCOUNT_DELETION || 'true' }}
      VITE_DESKTOP_WEB_URL: ${{ vars.VITE_DESKTOP_WEB_URL }}
      VITE_APP_VERSION: ${{ github.sha }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential ca-certificates curl wget file git tar gzip libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify public Supabase configuration
        run: |
          node -e 'if (!process.env.VITE_SUPABASE_URL || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY) { console.error("Missing Supabase build configuration"); process.exit(1) }'
          node -e 'const value = process.env.VITE_DESKTOP_WEB_URL; if (value) { const url = new URL(value); if (url.protocol !== "https:" || !url.pathname.endsWith("/")) throw new Error("Desktop web URL must be HTTPS and end with a slash"); }'

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles appimage --config '{"plugins":{"updater":{"endpoints":["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]}}}'

      - name: Check updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
          test -n "$(find "$bundle" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find "$bundle" -maxdepth 1 -name '*.AppImage.sig' -print -quit)"

      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ducat-linux-appimage-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish desktop release
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    needs: [desktop, ubuntu-package, fedora-package, arch-package, linux-appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download desktop packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ducat-*-${{ github.sha }}
          path: downloaded

      - name: Prepare release assets
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(node -p 'require("./package.json").version')
          if [[ ! "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "Invalid package version for release filenames" >&2
            exit 1
          fi
          mkdir -p release-assets
          copy_one() {
            local artifact="$1" pattern="$2" output="$3"
            local matches=()
            while IFS= read -r -d '' file; do matches+=("$file"); done < <(find "downloaded/ducat-$artifact-$COMMIT_SHA" -type f -name "$pattern" -print0 2>/dev/null)
            if (( ${#matches[@]} != 1 )); then
              echo "Expected exactly one $artifact package (pattern $pattern), found ${#matches[@]}" >&2
              exit 1
            fi
            cp -- "${matches[0]}" "release-assets/Ducat-${version}-${output}"
          }
          copy_one macos-arm64 '*.dmg' macos-arm64.dmg
          copy_one macos-x64 '*.dmg' macos-x64.dmg
          copy_one windows-x64 '*-setup.exe' windows-x64-setup.exe
          copy_one windows-arm64 '*-setup.exe' windows-arm64-setup.exe
          copy_one linux-x64 '*.deb' ubuntu-x64.deb
          copy_one fedora-x64 '*.rpm' fedora-x64.rpm
          copy_one arch-x64 '*.pkg.tar.zst' arch-x64.pkg.tar.zst
          copy_one linux-appimage '*.AppImage' linux-x86_64.AppImage
          printf '%s\n' "$version" > "$RUNNER_TEMP/ducat-release-version"

      - name: Build update manifest
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat "$RUNNER_TEMP/ducat-release-version")
          tag="v${version}"
          # Changelog: conventional-commit subjects since the previous release bump.
          prev_bump=$(git log --format='%H' --grep='^chore(release):' --skip=1 -n 1 2>/dev/null || true)
          notes=$(git log --no-merges --format='%s' "${prev_bump}..HEAD" 2>/dev/null \
            | grep -v '^chore(release):' \
            | sed -E 's/^feat(\([^)]*\))?: ?/New: /; s/^fix(\([^)]*\))?: ?/Fix: /' \
            | head -12)
          if [ -z "$notes" ]; then notes="Update to Ducat ${version}."; fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/ducat-changelog"
          node scripts/build-update-manifest.mjs \
            --downloaded downloaded \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --version "$version" \
            --notes "$notes" \
            --out release-assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(cat "$RUNNER_TEMP/ducat-release-version")
          tag="v${version}"
          notes="$RUNNER_TEMP/ducat-release-notes.md"
          {
            printf '## Changelog\n\n'
            sed 's/^/- /' "$RUNNER_TEMP/ducat-changelog"
            printf '\n---\n\n'
            printf 'Desktop build for version `%s` · commit `%s`.\n\n' "$version" "$COMMIT_SHA"
            printf 'Choose the installer for your operating system and architecture. '
            printf 'The macOS and Windows installers are not signed or notarized.\n'
            printf 'On Linux, the AppImage supports built-in updates; .deb, .rpm and pacman packages are updated with the package manager.\n'
          } > "$notes"
          options=(--draft)
          if [[ "$SOURCE_REF" != "refs/heads/$DEFAULT_BRANCH" && "$SOURCE_REF" != refs/tags/* ]]; then
            options+=(--prerelease)
          fi
          # Replace any existing release with the same version (e.g. a re-run).
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" release-assets/* \
            --target "$COMMIT_SHA" --title "Ducat ${version}" \
            --notes-file "$notes" "${options[@]}"
          gh release edit "$tag" --draft=false
