name: Mac App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the package to App Store Connect"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-appstore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Mac App Store package
    runs-on: macos-15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_DESKTOP_WEB_URL: ${{ vars.VITE_DESKTOP_WEB_URL }}
      VITE_ENABLE_ACCOUNT_DELETION: ${{ vars.VITE_ENABLE_ACCOUNT_DELETION || 'true' }}
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_APP_STORE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Verify public configuration
        shell: bash
        run: |
          node -e 'if (!process.env.VITE_SUPABASE_URL || !process.env.VITE_SUPABASE_PUBLISHABLE_KEY) { console.error("Missing Supabase build configuration"); process.exit(1) }'
          node -e 'const value = process.env.VITE_DESKTOP_WEB_URL; if (value) { const url = new URL(value); if (url.protocol !== "https:" || !url.pathname.endsWith("/")) throw new Error("Desktop web URL must be HTTPS and end with a slash"); }'

      - name: Import signing certificates
        env:
          APP_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo -n "$APP_CERTIFICATE_P12" | base64 --decode > app.p12
          echo -n "$INSTALLER_CERTIFICATE_P12" | base64 --decode > installer.p12
          security import app.p12 -k build.keychain -P "$APP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import installer.p12 -k build.keychain -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm app.p12 installer.p12

      - name: Write provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          echo -n "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/mas.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/mas.provisionprofile" > /dev/null

      - name: Build Mac App Store package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_PROVISIONING_PROFILE: ${{ runner.temp }}/mas.provisionprofile
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-macos-appstore.mjs

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app-store-${{ github.sha }}
          path: src-tauri/target/appstore/*.pkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo -n "$API_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"
          pkg=$(find src-tauri/target/appstore -name '*.pkg' -print -quit)
          test -n "$pkg"
          xcrun altool --upload-app --type macos --file "$pkg" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
